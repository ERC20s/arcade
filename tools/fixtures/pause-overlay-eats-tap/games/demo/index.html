Title: Demo
Description: Fixture game whose pause overlay exists but does not set pointer-events:none.
Controls: Arrow keys or tap to move; press P to pause.
-->

  </style>
</head>
<body>
  <a class="back" href="../../index.html">← Arcade</a>
  <div id="pauseOverlay"></div>

</html>
