<!--
Title: Fixture Launcher
Description: Launcher of the fixture arcade used by tools/test-check-arcade.mjs.
Controls: Tab/Enter to open a game link.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fixture Arcade</title>
</head>
<body>
  <h1>Fixture Arcade</h1>
  <ul id="game-list">
    <!--
      A commented-out example entry, as the real launcher carries one. It points
      at a game that does not exist, so if the checker ever stopped skipping
      comments the clean fixture would fail with a dead launcher link.
      <li><a class="game" href="games/ghost/index.html">Ghost — not a real game</a></li>
    -->
    <li><a class="game" href="games/demo/index.html">Demo — fixture game</a></li>
  </ul>
</body>
</html>
