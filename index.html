<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arcade • Launcher</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1220;color:#e6eef8;padding:24px}
    .card{background:linear-gradient(180deg,#0f1a2b, #071020);border-radius:12px;padding:18px;max-width:760px;width:100%;box-shadow:0 8px 30px rgba(2,6,23,.6)}
    h1{margin:0 0 8px;font-size:20px}
    p{margin:0 0 16px;color:#c6d4e9}
    .games{display:flex;flex-wrap:wrap;gap:10px}
    a.game{display:block;padding:12px 14px;border-radius:8px;background:#0b2237;color:#bfe6ff;text-decoration:none;font-weight:600}
    footer{margin-top:12px;color:#9fb7d0;font-size:13px}
    @media (max-width:520px){.card{padding:14px}} 
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Arcade • Launcher</h1>
      <p>One-folder games, zero dependencies, keyboard & touch. Click a game to open it in this tab.</p>
      <div class="games">
        <!-- Manually list available games; contributors add their folder and link here. -->
        <a class="game" href="games/hello/index.html">Hello — starter game</a>
      </div>
      <footer>Layout: games/&lt;name&gt;/index.html — single-file pages only (≤400 lines)</footer>
    </div>
  </div>
</body>
</html>
