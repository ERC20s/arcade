<!--
Title: Template Runner
Description: Minimal runner scaffold demonstrating keyboard + touch, score and pause.
Controls: Arrow keys to move, Space to action, P to pause, M to mute; tap to action, on-screen pause and sound buttons; Tab to the "Arcade" link and Enter to go back to the launcher (tap it on touch).
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Template Runner</title>
  <style>
    html,body{height:100%;margin:0;font-family:sans-serif;background:#111;color:#eee}
    canvas{display:block;background:#222;margin:0 auto;touch-action:none}
    #best{color:#aaa;font-size:14px}
    #hud{position:fixed;left:10px;top:10px;font-size:18px}
    #buttons{position:fixed;right:10px;top:10px;display:flex;gap:8px;z-index:10}
    #buttons button{min-width:44px;min-height:44px;padding:8px 12px;background:#444;color:#fff;border-radius:6px;touch-action:manipulation}
    #pauseBtn{touch-action:none}
    /* The overlay sits under the controls and never eats a tap: the back link and
       the pause button must still work while the game is paused. */
    #pauseOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#fff;font-size:28px;z-index:5;pointer-events:none}
    /* Back to the launcher: required by CONTRIBUTING.md. Bottom-left keeps it clear
       of the HUD (top-left) and the pause button (top-right) down to ~320px width.
       44x44 CSS pixels minimum so it is a real tap target. */
    a.back{position:fixed;left:10px;bottom:10px;z-index:10;display:inline-flex;align-items:center;
           min-width:44px;min-height:44px;box-sizing:border-box;padding:10px 14px;
           background:#333;color:#eee;border:1px solid #555;border-radius:8px;
           font-size:16px;line-height:1;text-decoration:none}
    a.back:hover{background:#3d3d3d}
    a.back:focus{outline:3px solid #0db;outline-offset:2px}
    a.back:focus-visible{outline:3px solid #0db;outline-offset:2px}
    button{font:inherit}
  </style>
</head>
<body>
  <div id="hud">Score: <span id="score" aria-live="polite" aria-atomic="true">0</span> <span id="best" aria-hidden="true">best 0</span></div>
  <div id="buttons">
    <button id="soundBtn" aria-pressed="true">Sound on</button>
    <button id="pauseBtn" aria-pressed="false">Pause</button>
  </div>
  <div id="pauseOverlay" role="status" aria-hidden="true">Paused</div>
  <canvas id="c"></canvas>
  <!-- Required by CONTRIBUTING.md: keep this link when you copy the template. -->
  <a class="back" href="../../index.html">&larr; Arcade</a>

  <!-- Required: the shared high-score, sound and canvas helpers (see common/arcade.js). -->
  <script src="../../common/arcade.js"></script>
  <script>
    // Minimal game scaffold: a square that moves horizontally and a score that increases.
    const canvas = document.getElementById('c');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');

    const w = 600, h = 400; // logical size: draw in these units, Arcade.fitCanvas scales them
    const hs = Arcade.highScore('template'); // use your folder name: arcade-<name>-best in localStorage
    Arcade.soundButton(document.getElementById('soundBtn'));
    let x = 50, y = h/2 - 10, vx = 0; // vx is pixels per second
    let score = 0;
    let scoreAcc = 0; // fractional accumulator so visible score steps cleanly
    let paused = false;

    function setPaused(v){
      paused = v;
      pauseOverlay.style.display = paused ? 'flex' : 'none';
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
      pauseOverlay.setAttribute('aria-hidden', (!paused).toString());
    }

    function addScore(n){
      score += n;
      scoreEl.textContent = score;
      hs.submit(score);
      bestEl.textContent = 'best ' + hs.best;
    }

    // The browser only owns the keys a focused control actually consumes: Tab always
    // moves focus, and Enter/Space follow a link or press a button while one has focus.
    // Only those stand down here, so the back link still works and pause never
    // double-fires. Every other key stays with the game: clicking the on-screen Pause
    // button leaves focus on it, and the movement keys must keep working anyway.
    function keysBelongToBrowser(e){
      if(e.key === 'Tab') return true;
      if(e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return false;
      const t = e.target;
      if(!t || !t.closest) return false;
      return !!t.closest('a[href], button, input, select, textarea, [contenteditable="true"]');
    }

    // Controls: keyboard
    window.addEventListener('keydown', (e)=>{
      if(keysBelongToBrowser(e)) return;
      if(e.key === 'ArrowRight' || e.key === 'd') { vx = 120; e.preventDefault(); } // pixels per second
      if(e.key === 'ArrowLeft' || e.key === 'a') { vx = -120; e.preventDefault(); }
      if(e.key === ' ') { addScore(1); Arcade.sound.beep(660, 40); e.preventDefault(); }
      if(e.key.toLowerCase() === 'p') setPaused(!paused);
      if(e.key.toLowerCase() === 'm') Arcade.sound.toggle();
    });
    // keyup is never guarded: a key released after focus moved must still stop motion.
    window.addEventListener('keyup', (e)=>{
      if(e.key === 'ArrowRight' || e.key === 'd') vx = 0;
      if(e.key === 'ArrowLeft' || e.key === 'a') vx = 0;
    });

    // Touch: tap to action, long-press not needed; on-screen pause button provided.
    canvas.addEventListener('touchstart', (e)=>{
      e.preventDefault();
      // treat any tap as action
      addScore(1); Arcade.sound.beep(660, 40);
    }, {passive:false});

    // Pause button touch/click
    pauseBtn.addEventListener('click', ()=> setPaused(!paused));
    pauseBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); setPaused(!paused); }, {passive:false});

    // Switching tab or app pauses the game instead of letting it run unseen.
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) setPaused(true); });

    // Simple game loop
    let last = performance.now();
    function loop(t){
      const dt = Math.min(0.25, (t - last) / 1000);
      last = t;
      if(!paused){
        update(dt);
        render();
      }
      requestAnimationFrame(loop);
    }

    function update(dt){
      // vx is pixels per second, so multiply by dt to get pixels this frame
      x += vx * dt;
      if(x < 0) x = 0;
      if(x > w-20) x = w-20;
      // increase score slowly as time passes: add ~10 points per second using a fractional accumulator
      scoreAcc += dt * 10;
      if(scoreAcc >= 1){
        const add = Math.floor(scoreAcc);
        scoreAcc -= add;
        addScore(add);
      }
    }

    function render(){
      ctx.clearRect(0,0,w,h);
      // ground
      ctx.fillStyle = '#333';
      ctx.fillRect(0,h-40,w,40);
      // player
      ctx.fillStyle = '#0db';
      ctx.fillRect(x,y,20,20);
    }

    // Scale to the viewport with a devicePixelRatio backing store (sharp on phones),
    // keeping the 3:2 aspect; repaint after each refit because resizing clears it.
    const ctx = Arcade.fitCanvas(canvas, w, h,
      () => ({w: Math.min(window.innerWidth - 20, 800), h: window.innerHeight - 130}),
      render);

    // start
    requestAnimationFrame(loop);
  </script>
</body>
</html>
