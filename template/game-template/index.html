<!--
Title: Template Runner
Description: Minimal runner scaffold demonstrating keyboard + touch, score and pause.
Controls: Arrow keys to move, Space to action, P to pause; tap to action, on-screen pause button.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Template Runner</title>
  <style>
    html,body{height:100%;margin:0;font-family:sans-serif;background:#111;color:#eee}
    canvas{display:block;background:#222;margin:0 auto}
    #hud{position:fixed;left:10px;top:10px;font-size:18px}
    #pauseBtn{position:fixed;right:10px;top:10px;padding:8px 12px;background:#444;color:#fff;border-radius:6px;touch-action:none}
    #pauseOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);color:#fff;font-size:28px}
    button{font:inherit}
  </style>
</head>
<body>
  <div id="hud">Score: <span id="score">0</span></div>
  <button id="pauseBtn" aria-pressed="false">Pause</button>
  <div id="pauseOverlay" role="status" aria-hidden="true">Paused</div>
  <canvas id="c" width="600" height="400"></canvas>

  <script>
    // Minimal game scaffold: a square that moves horizontally and a score that increases.
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');

    const SPEED = 120;        // pixels per second — movement is time based, not per frame
    const TIME_POINTS = 10;   // score points earned per second of play
    const MAX_DT = 0.1;       // clamp long frames (background tab, slow device)

    let w = canvas.width, h = canvas.height;
    let x = 50, y = h/2 - 10;
    let score = 0;            // float accumulator; the HUD shows Math.floor(score)
    let shown = -1;           // last integer written to the HUD
    let paused = false;
    // Held direction keys, so releasing one does not cancel the other.
    const held = { left:false, right:false };

    function velocity(){
      return (held.right ? SPEED : 0) - (held.left ? SPEED : 0);
    }

    function showScore(){
      const n = Math.floor(score);
      if(n !== shown){ shown = n; scoreEl.textContent = n; }
    }

    function addScore(n){ score += n; showScore(); }

    function setPaused(v){
      paused = v;
      if(paused){ held.left = held.right = false; }
      pauseOverlay.style.display = paused ? 'flex' : 'none';
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
      pauseOverlay.setAttribute('aria-hidden', (!paused).toString());
      if(!paused) last = performance.now(); // do not bank paused time as one huge frame
    }

    // Keys this game owns — swallowed so arrows/Space never scroll the page.
    const HANDLED = ['ArrowRight','ArrowLeft','a','A','d','D',' ','p','P'];

    // Controls: keyboard
    window.addEventListener('keydown', (e)=>{
      if(e.ctrlKey || e.metaKey || e.altKey) return;
      if(HANDLED.indexOf(e.key) !== -1) e.preventDefault();
      if(e.key === 'p' || e.key === 'P'){ if(!e.repeat) setPaused(!paused); return; }
      if(paused) return;                       // no input reaches the game while paused
      if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') held.right = true;
      if(e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') held.left  = true;
      if(e.key === ' ' && !e.repeat) addScore(1);
    });
    window.addEventListener('keyup', (e)=>{
      if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') held.right = false;
      if(e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') held.left  = false;
    });
    // A tab switch or alert can eat the keyup: drop everything held.
    window.addEventListener('blur', ()=>{ held.left = held.right = false; });

    // Touch: tap to action, long-press not needed; on-screen pause button provided.
    canvas.addEventListener('touchstart', (e)=>{
      e.preventDefault();
      if(paused) return;
      // treat any tap as action
      addScore(1);
    }, {passive:false});

    // Pause button touch/click. Blur it so a later Space does not re-toggle pause.
    pauseBtn.addEventListener('click', ()=>{ setPaused(!paused); pauseBtn.blur(); });
    pauseBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); setPaused(!paused); pauseBtn.blur(); }, {passive:false});

    // Simple game loop
    let last = performance.now();
    function loop(t){
      let dt = (t - last) / 1000; last = t;
      if(dt > MAX_DT) dt = MAX_DT;
      if(dt < 0) dt = 0;
      if(!paused){
        update(dt);
        render();
      }
      requestAnimationFrame(loop);
    }

    function update(dt){
      x += velocity() * dt;
      if(x < 0) x = 0;
      if(x > w-20) x = w-20;
      // increase score slowly as time passes
      addScore(dt * TIME_POINTS);
    }

    function render(){
      ctx.clearRect(0,0,w,h);
      // ground
      ctx.fillStyle = '#333';
      ctx.fillRect(0,h-40,w,40);
      // player
      ctx.fillStyle = '#0db';
      ctx.fillRect(x,y,20,20);
    }

    // resize to fit width while keeping aspect
    function fit(){
      const maxW = Math.min(window.innerWidth-20, 800);
      const scale = Math.min(1, maxW / 600);
      canvas.style.width = Math.round(600*scale) + 'px';
      canvas.style.height = Math.round(400*scale) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();

    // start
    showScore();
    render();
    last = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
